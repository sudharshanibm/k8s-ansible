- name: "Phase 3: Post-upgrade cluster verification"
  hosts: masters[0]
  become: true
  gather_facts: false
  tasks:
    - name: Get all node statuses
      command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: node_status
      changed_when: false

    - name: Display cluster status
      debug:
        msg: |
          ====================================
          Post-Upgrade Cluster Status
          ====================================
          {{ node_status.stdout }}
          ====================================

    - name: Check for non-running pods in kube-system
      shell: kubectl get pods -n kube-system --no-headers | grep -v -E 'Running|Completed' || true
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: bad_pods
      changed_when: false

    - name: Display problematic pods (if any)
      debug:
        msg: |
          Non-running kube-system pods:
          {{ bad_pods.stdout | default('None - all pods healthy! ') }}
      when: bad_pods.stdout | length > 0

    - name: All kube-system pods healthy
      debug:
        msg: " All kube-system pods are Running/Completed"
      when: bad_pods.stdout | length == 0
